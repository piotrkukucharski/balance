openapi: 3.1.0
info:
  title: Balance Personal Finance REST API
  version: 1.0.0
  description: >
    OpenAPI 3.1 Contract for Balance Personal Finance application.
    Implements multi-tenant budgeting, double-entry financial ledger,
    currency exchange rates, automated matching rules, and advanced YNAB/Actual-inspired analytics.
servers:
  - url: /api/v1
    description: Current API v1 endpoint
paths:
  /auth/register:
    post:
      summary: Register a new user account
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /auth/login:
    post:
      summary: User login
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      summary: User logout
      operationId: logoutUser
      responses:
        '204':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/tokens:
    get:
      summary: List personal access tokens
      operationId: listTokens
      responses:
        '200':
          description: List of active and historical tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiTokenItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create a personal access token
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: Personal access token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/tokens/{id}:
    delete:
      summary: Revoke a personal access token
      operationId: revokeToken
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Token revoked successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/me:
    get:
      summary: Get current user profile
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      summary: Update current user profile
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /exchange-rates:
    get:
      summary: Query historical exchange rates
      operationId: getExchangeRates
      parameters:
        - name: base
          in: query
          required: true
          schema:
            type: string
            example: EUR
        - name: target
          in: query
          required: true
          schema:
            type: string
            example: PLN
        - name: from
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: UTC microseconds timestamp
        - name: to
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: UTC microseconds timestamp
      responses:
        '200':
          description: Exchange rate time-series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangeRateItem'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /exchange-rates/sync:
    post:
      summary: Trigger synchronization of central bank exchange rates
      operationId: syncExchangeRates
      responses:
        '200':
          description: Rates synchronized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRatesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /budgets:
    get:
      summary: List user budgets
      operationId: listBudgets
      responses:
        '200':
          description: Budgets the user is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create a new budget
      operationId: createBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetRequest'
      responses:
        '201':
          description: Budget created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetSummary'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /budgets/{budgetId}:
    patch:
      summary: Update budget settings (OWNER required)
      operationId: updateBudget
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetRequest'
      responses:
        '200':
          description: Budget updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetSummary'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /budgets/{budgetId}/invitations:
    post:
      summary: Invite a user to the budget (ADMIN+ required)
      operationId: inviteBudgetMember
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /invitations/{token}/accept:
    post:
      summary: Accept a budget invitation
      operationId: acceptInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /integrations/providers:
    get:
      summary: List supported bank integration providers
      operationId: listIntegrationProviders
      responses:
        '200':
          description: Supported integration providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationProvider'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /integrations/{provider}/connect:
    post:
      summary: Generate OAuth authorization URL and state token
      operationId: connectProvider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [GOCARDLESS, MOCK, CSV]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectProviderRequest'
      responses:
        '200':
          description: Authorization redirection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectProviderResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /integrations/{provider}/callback:
    get:
      summary: OAuth callback handler
      operationId: providerCallback
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: ref
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Provider connected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCallbackResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /budgets/{budgetId}/integrations/{integrationId}/link-account:
    post:
      summary: Link bank integration to a budget account (EDITOR+ required)
      operationId: linkIntegrationAccount
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
        - name: integrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAccountRequest'
      responses:
        '200':
          description: Account linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountIntegrationLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /budgets/{budgetId}/integrations/{integrationId}/sync:
    post:
      summary: Trigger bank integration sync (EDITOR+ required)
      operationId: syncIntegration
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
        - name: integrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sync started or completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncIntegrationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /budgets/{budgetId}/accounts/{accountId}/import-csv:
    post:
      summary: Import CSV bank statement into account (EDITOR+ required)
      operationId: importAccountCsv
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file (max 10 MiB / 50,000 rows)
      responses:
        '200':
          description: CSV parsed and imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /budgets/{budgetId}/parties:
    get:
      summary: List parties in budget
      operationId: listParties
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      responses:
        '200':
          description: List of parties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Party'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create a party
      operationId: createParty
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyRequest'
      responses:
        '201':
          description: Party created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /budgets/{budgetId}/parties/{id}:
    put:
      summary: Update a party
      operationId: updateParty
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartyRequest'
      responses:
        '200':
          description: Party updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /budgets/{budgetId}/parties/{id}/cashflow:
    get:
      summary: Query party cashflow
      operationId: getPartyCashflow
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
        - name: from
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: to
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: exclude_internal
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Party cashflow summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyCashflowSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /budgets/{budgetId}/accounts:
    get:
      summary: List budget accounts
      operationId: listAccounts
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create a budget account
      operationId: createAccount
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /budgets/{budgetId}/matching-rules:
    get:
      summary: List matching rules
      operationId: listMatchingRules
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      responses:
        '200':
          description: List of matching rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchingRule'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create a matching rule
      operationId: createMatchingRule
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchingRuleRequest'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingRule'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /budgets/{budgetId}/{entityType}/{id}/history:
    get:
      summary: Get entity version history (ADMIN+ required)
      operationId: getEntityHistory
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [parties, accounts, matching-rules, raw-transactions, budget-transactions, saved-reports]
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Entity historical versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityVersionItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /budgets/{budgetId}/{entityType}/{id}/restore:
    post:
      summary: Restore entity to a previous version (ADMIN+ required)
      operationId: restoreEntityVersion
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [parties, accounts, matching-rules, raw-transactions, budget-transactions, saved-reports]
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreVersionRequest'
      responses:
        '200':
          description: Entity restored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /budgets/{budgetId}/raw-transactions:
    get:
      summary: List raw transactions
      operationId: listRawTransactions
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, PROCESSED, IGNORED]
        - name: account_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of raw transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RawTransaction'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /budgets/{budgetId}/transactions:
    get:
      summary: List budget transactions
      operationId: listBudgetTransactions
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
        - name: from
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: to
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: bucket_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of budget transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetTransaction'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create a direct budget transaction (Cash / non-integrated)
      operationId: createBudgetTransaction
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetTransactionRequest'
      responses:
        '201':
          description: Budget transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetTransaction'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /budgets/{budgetId}/transactions/resolve:
    post:
      summary: Resolve raw transactions into budget transactions (Move, Merge, Split)
      operationId: resolveTransactions
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveTransactionsRequest'
      responses:
        '200':
          description: Transactions resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveTransactionsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /budgets/{budgetId}/buckets:
    get:
      summary: List buckets with balances
      operationId: listBuckets
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      responses:
        '200':
          description: List of buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bucket'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create a bucket
      operationId: createBucket
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBucketRequest'
      responses:
        '201':
          description: Bucket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /budgets/{budgetId}/buckets/{id}/targets:
    post:
      summary: Create a target in a bucket
      operationId: createTarget
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTargetRequest'
      responses:
        '201':
          description: Target created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /budgets/{budgetId}/targets/generate-formula:
    post:
      summary: Generate Lua formula with AI assistant (EDITOR+ required)
      operationId: generateFormula
      parameters:
        - $ref: '#/components/parameters/BudgetIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateFormulaRequest'
      responses:
        '200':
          description: Formula generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateFormulaResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'

