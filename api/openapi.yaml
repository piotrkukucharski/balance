components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal Access Token (bal_pat_...)
    cookieAuth:
      type: apiKey
      in: cookie
      name: balance_session
      description: Stateful browser session cookie

  parameters:
    BudgetIdPathParam:
      name: budgetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportCommonQueryParams:
      name: params
      in: query
      required: false
      schema:
        type: object
        properties:
          from:
            type: integer
            format: int64
          to:
            type: integer
            format: int64
          currency:
            type: string
          exclude_internal:
            type: boolean

  responses:
    BadRequestError:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Insufficient permissions for requested action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Conflict with existing state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimitError:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Invalid input data
        code:
          type: string
          example: INVALID_ARGUMENT
        details:
          type: string

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - display_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
          minLength: 1

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      required:
        - id
        - email
        - display_name
        - locale
        - date_format
        - number_format
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type: string
          example: en-US
        date_format:
          type: string
          example: YYYY-MM-DD
        number_format:
          type: string
          example: 1,234.56
        created_at:
          type: integer
          format: int64

    UpdateUserRequest:
      type: object
      properties:
        display_name:
          type: string
        locale:
          type: string
        date_format:
          type: string
        number_format:
          type: string

    CreateTokenRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        expires_in_days:
          type: integer
          default: 30

    CreateTokenResponse:
      type: object
      required:
        - id
        - name
        - token
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: Cleartext Personal Access Token (only shown once)
          example: bal_pat_a1b2c3d4e5f6...
        expires_at:
          type: integer
          format: int64

    ApiTokenItem:
      type: object
      required:
        - id
        - name
        - created_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        last_used_at:
          type: integer
          format: int64
          nullable: true
        revoked_at:
          type: integer
          format: int64
          nullable: true

    ExchangeRateItem:
      type: object
      required:
        - base_currency
        - target_currency
        - rate_date
        - rate_micros
        - source
      properties:
        base_currency:
          type: string
        target_currency:
          type: string
        rate_date:
          type: integer
          format: int64
        rate_micros:
          type: integer
          format: int64
        source:
          type: string

    SyncRatesResponse:
      type: object
      required:
        - synced_count
      properties:
        synced_count:
          type: integer

    BudgetSummary:
      type: object
      required:
        - id
        - name
        - default_currency
        - timezone
        - role
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        default_currency:
          type: string
        timezone:
          type: string
        role:
          type: string
          enum: [OWNER, ADMIN, EDITOR, VIEWER]
        created_at:
          type: integer
          format: int64

    CreateBudgetRequest:
      type: object
      required:
        - name
        - default_currency
        - timezone
      properties:
        name:
          type: string
          minLength: 1
        default_currency:
          type: string
          example: PLN
        timezone:
          type: string
          example: Europe/Warsaw

    UpdateBudgetRequest:
      type: object
      properties:
        name:
          type: string
        timezone:
          type: string

    CreateInvitationRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, EDITOR, VIEWER]

    InvitationResponse:
      type: object
      required:
        - id
        - email
        - role
        - invite_token
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, EDITOR, VIEWER]
        invite_token:
          type: string
        expires_at:
          type: integer
          format: int64

    AcceptInvitationResponse:
      type: object
      required:
        - budget_id
        - role
      properties:
        budget_id:
          type: string
          format: uuid
        role:
          type: string

    IntegrationProvider:
      type: object
      required:
        - provider
        - display_name
      properties:
        provider:
          type: string
        display_name:
          type: string

    ConnectProviderRequest:
      type: object
      properties:
        institution_id:
          type: string
        country:
          type: string

    ConnectProviderResponse:
      type: object
      required:
        - redirect_url
        - state
      properties:
        redirect_url:
          type: string
        state:
          type: string

    ProviderCallbackResponse:
      type: object
      required:
        - integration_id
        - provider
        - status
      properties:
        integration_id:
          type: string
          format: uuid
        provider:
          type: string
        status:
          type: string

    LinkAccountRequest:
      type: object
      required:
        - account_id
        - external_account_id
      properties:
        account_id:
          type: string
          format: uuid
        external_account_id:
          type: string

    AccountIntegrationLinkResponse:
      type: object
      required:
        - id
        - account_id
        - integration_id
        - external_account_id
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        integration_id:
          type: string
          format: uuid
        external_account_id:
          type: string

    SyncIntegrationResponse:
      type: object
      required:
        - imported_count
      properties:
        imported_count:
          type: integer

    CsvImportResponse:
      type: object
      required:
        - rows_processed
        - imported_count
        - duplicate_count
      properties:
        rows_processed:
          type: integer
        imported_count:
          type: integer
        duplicate_count:
          type: integer

    Party:
      type: object
      required:
        - id
        - version
        - name
        - party_type
        - is_user_owned
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        name:
          type: string
        party_type:
          type: string
          enum: [INDIVIDUAL, ORGANIZATION]
        is_user_owned:
          type: boolean
        notes:
          type: string
          nullable: true

    CreatePartyRequest:
      type: object
      required:
        - name
        - party_type
      properties:
        name:
          type: string
        party_type:
          type: string
          enum: [INDIVIDUAL, ORGANIZATION]
        is_user_owned:
          type: boolean
          default: false
        notes:
          type: string

    UpdatePartyRequest:
      type: object
      properties:
        name:
          type: string
        party_type:
          type: string
          enum: [INDIVIDUAL, ORGANIZATION]
        is_user_owned:
          type: boolean
        notes:
          type: string

    PartyCashflowSummary:
      type: object
      required:
        - party_id
        - total_inflow_minor
        - total_outflow_minor
        - net_flow_minor
      properties:
        party_id:
          type: string
          format: uuid
        total_inflow_minor:
          type: integer
          format: int64
        total_outflow_minor:
          type: integer
          format: int64
        net_flow_minor:
          type: integer
          format: int64

    Account:
      type: object
      required:
        - id
        - version
        - party_id
        - name
        - account_type
        - primary_currency
        - is_closed
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        party_id:
          type: string
          format: uuid
        name:
          type: string
        account_type:
          type: string
          enum: [CHECKING, SAVINGS, CREDIT_CARD, CASH, INVESTMENT, EXTERNAL]
        primary_currency:
          type: string
        iban:
          type: string
          nullable: true
        favicon_type:
          type: string
          enum: [EMOJI, URL]
        favicon_value:
          type: string
          nullable: true
        is_closed:
          type: boolean
        balances:
          type: object
          additionalProperties:
            type: integer
            format: int64

    CreateAccountRequest:
      type: object
      required:
        - name
        - account_type
        - primary_currency
      properties:
        name:
          type: string
        account_type:
          type: string
          enum: [CHECKING, SAVINGS, CREDIT_CARD, CASH, INVESTMENT, EXTERNAL]
        primary_currency:
          type: string
        party_id:
          type: string
          format: uuid
        iban:
          type: string
        favicon_type:
          type: string
          enum: [EMOJI, URL]
        favicon_value:
          type: string
        initial_balance_minor:
          type: integer
          format: int64

    MatchingRule:
      type: object
      required:
        - id
        - version
        - name
        - priority
        - match_field
        - match_operator
        - match_pattern
        - target_counterparty_account_id
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        name:
          type: string
        priority:
          type: integer
        match_field:
          type: string
          enum: [RAW_PAYEE, COUNTERPARTY_IBAN, REFERENCE, ANY]
        match_operator:
          type: string
          enum: [CONTAINS, PREFIX, EXACT, REGEX]
        match_pattern:
          type: string
        target_counterparty_account_id:
          type: string
          format: uuid
        default_bucket_id:
          type: string
          format: uuid
          nullable: true

    CreateMatchingRuleRequest:
      type: object
      required:
        - name
        - match_field
        - match_operator
        - match_pattern
        - target_counterparty_account_id
      properties:
        name:
          type: string
        priority:
          type: integer
          default: 100
        match_field:
          type: string
          enum: [RAW_PAYEE, COUNTERPARTY_IBAN, REFERENCE, ANY]
        match_operator:
          type: string
          enum: [CONTAINS, PREFIX, EXACT, REGEX]
        match_pattern:
          type: string
        target_counterparty_account_id:
          type: string
          format: uuid
        default_bucket_id:
          type: string
          format: uuid

    EntityVersionItem:
      type: object
      required:
        - id
        - version
        - action
        - agent_id
        - correlation_id
        - created_at
      properties:
        id:
          type: string
        version:
          type: integer
        action:
          type: string
        agent_id:
          type: string
        correlation_id:
          type: string
        created_at:
          type: integer
          format: int64
        payload:
          type: object

    RestoreVersionRequest:
      type: object
      required:
        - target_version
      properties:
        target_version:
          type: integer

