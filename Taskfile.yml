version: '3'

silent: true

dotenv: ['.env']

vars:
  BIN_NAME: balance
  DATA_DIR: '{{.DATA_DIR | default "./data"}}'
  PORT: '{{.PORT | default "8080"}}'

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list

  # Development tasks
  dev:init:
    desc: "Initialize development environment and directories"
    cmds:
      - mkdir -p {{.DATA_DIR}}/budgets
      - test -f .env || cp .env.example .env
      - npx skills experimental_install
      - go mod tidy
      - echo "Development environment initialized at {{.DATA_DIR}}"

  dev:generate:openapi:
    desc: "Generate Go server interface and DTO types from OpenAPI contract using oapi-codegen"
    cmds:
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1 --config=api/oapi-codegen.yaml api/openapi.yaml
      - echo "OpenAPI server interfaces and models generated at internal/api/openapi.gen.go"

  dev:build:
    desc: "Build the Balance server binary"
    cmds:
      - go build -o bin/{{.BIN_NAME}} ./cmd/server

  dev:up:
    desc: "Start the Balance development server"
    deps: [dev:init]
    cmds:
      - echo "http://localhost:{{.PORT}}"
      - DATA_DIR={{.DATA_DIR}} PORT={{.PORT}} go run ./cmd/server

  dev:stop:
    desc: "Stop running Balance server processes"
    cmds:
      - pkill -f "cmd/server" || pkill -f "bin/{{.BIN_NAME}}" || true
      - echo "Balance server stopped"

  worker:sync-fx:
    desc: "Synchronize central bank exchange rates (ECB priority, NBP fallback) into main.db"
    cmds:
      - DATA_DIR={{.DATA_DIR}} go run ./cmd/server worker:sync-fx {{.CLI_ARGS}}

  # Worktree management tasks
  dev:worktree:create:
    desc: "Create an isolated git worktree with dedicated port and data directory in ../development/<name> (accepts task ID e.g. BALANCE-2)"
    cmds:
      - go run ./scripts/worktree.go create {{.CLI_ARGS}}

  dev:worktree:clear:
    desc: "Remove an isolated git worktree (preserves branch by default, pass --delete-branch to delete branch)"
    cmds:
      - go run ./scripts/worktree.go clear {{.CLI_ARGS}}

  dev:worktree:clearWithBranch:
    desc: "Remove an isolated git worktree and delete its branch"
    cmds:
      - go run ./scripts/worktree.go clear --delete-branch {{.CLI_ARGS}}

  dev:worktree:finish:
    desc: "Finish worktree: rebase branch on main, rebase main on branch, and remove worktree"
    cmds:
      - go run ./scripts/worktree.go finish {{.CLI_ARGS}}

  dev:worktree:update:maintree:
    desc: "Fast-forward maintree branch from specified worktree branch (only runs on maintree)"
    cmds:
      - go run ./scripts/worktree.go update-maintree {{.CLI_ARGS}}

  dev:worktree:update:branch:
    desc: "Rebase current worktree branch onto main (only runs inside secondary worktree)"
    cmds:
      - go run ./scripts/worktree.go update-branch {{.CLI_ARGS}}

  # Test tasks
  test:all:
    desc: "Run all unit and integration tests"
    cmds:
      - go test -v -race ./...

  test:unit:
    desc: "Run algorithmic and domain unit tests (primitives, auth, lua, budget, rule, report)"
    cmds:
      - go test -v ./internal/domain/... ./internal/auth/... ./internal/lua/... ./internal/budget/... ./internal/rule/... ./internal/report/...

  test:db:
    desc: "Run database and tenant connection pool tests"
    cmds:
      - go test -v ./internal/db/...

  test:transaction:
    desc: "Run transaction deduplication and resolution tests"
    cmds:
      - go test -v ./internal/transaction/...

  test:ai:
    desc: "Run AI Formula Assistant tests (with Mock provider)"
    cmds:
      - go test -v ./internal/ai/...

  test:web:
    desc: "Run HTTP web routes and handlers integration tests"
    cmds:
      - go test -v ./internal/web/handlers/...

  test:bdd:
    desc: "Run Godog BDD feature test suite"
    cmds:
      - go test -v ./internal/bdd/...

  test:e2e:
    desc: "Run headless Chromium browser E2E Happy Path test suite (Godog + go-rod)"
    cmds:
      - go test -v ./internal/e2e/...

  test:e2e:headed:
    desc: "Run browser E2E test suite in visible Chromium window with slow motion"
    cmds:
      - E2E_HEADLESS=false E2E_SLOWMO=150ms go test -v ./internal/e2e/...

  test:heavy:
    desc: "Run 10-year multi-currency heavy load fixture test"
    cmds:
      - go test -v ./internal/testutil/heavyfixture/...

  test:bench:
    desc: "Run performance benchmarks"
    cmds:
      - go test -bench=. -benchmem ./...

  agy:
    desc: "agy"
    cmds:
      - agy --dangerously-skip-permissions

  # Fixtures management tasks
  fixtures:create-user:
    desc: "Create a user account (e.g. task fixtures:create-user -- --login=... --password=... --user-id=... --first-action-at=...)"
    cmds:
      - DATA_DIR={{.DATA_DIR}} go run ./cmd/fixtures create-user {{.CLI_ARGS}}

  fixtures:create-bucket:
    desc: "Create a budget bucket tenant (e.g. task fixtures:create-bucket -- --bucket-id=... --name=... --owner-user-id=... --timezone=... --first-action-at=...)"
    cmds:
      - DATA_DIR={{.DATA_DIR}} go run ./cmd/fixtures create-bucket {{.CLI_ARGS}}

  fixtures:load:
    desc: "Load rich multi-currency fixtures into budget (e.g. task fixtures:load -- --bucket-id=... --user-id=... --first-action-at=... --last-transaction=...)"
    cmds:
      - DATA_DIR={{.DATA_DIR}} go run ./cmd/fixtures load {{.CLI_ARGS}}

  fixtures:remove-bucket:
    desc: "Remove a budget bucket and its tenant SQLite database (e.g. task fixtures:remove-bucket -- --bucket-id=...)"
    cmds:
      - DATA_DIR={{.DATA_DIR}} go run ./cmd/fixtures remove-bucket {{.CLI_ARGS}}

  fixtures:remove-user:
    desc: "Remove a user account (e.g. task fixtures:remove-user -- --user-id=...)"
    cmds:
      - DATA_DIR={{.DATA_DIR}} go run ./cmd/fixtures remove-user {{.CLI_ARGS}}

  fixtures:all:
    desc: "Run entire fixtures pipeline with unified correlationId and progress bars (e.g. task fixtures:all -- --login=... --password=... --user-id=... --name=... --bucket-id=... --timezone=... --first-action-at=... --last-transaction=... [--clean])"
    cmds:
      - DATA_DIR={{.DATA_DIR}} go run ./cmd/fixtures all {{.CLI_ARGS}}

  fixtures:demo:
    desc: "Provision ready-to-use demo fixtures environment with credentials from .env (FIXTURES_DEMO_LOGIN, FIXTURES_DEMO_PASSWORD)"
    cmds:
      - >-
        DATA_DIR={{.DATA_DIR}} go run ./cmd/fixtures all
        --login="{{.FIXTURES_DEMO_LOGIN}}"
        --password="{{.FIXTURES_DEMO_PASSWORD}}"
        --user-id="01a14f48-0f1c-778d-9768-d9fb92f6675c"
        --name="Home Budget"
        --bucket-id="01a14f5b-8b70-702c-b4da-3b10e2bd6b1b"
        --timezone="Europe/Warsaw"
        --first-action-at="2026-01-01"
        --last-transaction="2026-05-01"
        --clean
        {{.CLI_ARGS}}


